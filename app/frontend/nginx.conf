# Nginx configuration of the production frontend image (Dockerfile.prod).
#
# Serves the built single-page application. Paths that are not files
# (/detections, /rules, ...) are client-side routes and fall back to
# index.html, so reloading a page or opening a deep link works.
#
# /api is forwarded to the backend, including the WebSocket upgrade for
# /api/v1/ws/. The upstream is resolved per request through Docker's DNS, so
# this container starts even when no host named "backend" exists yet (for
# example behind another proxy that routes /api itself).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $mxtac_backend http://backend:8080;

    # The backend uses X-Forwarded-For for its rate limits. It is set to the
    # address of the connecting client, so a client cannot choose it. When this
    # container runs behind another proxy, route /api to the backend at that
    # proxy (as app/nginx/nginx.conf does); otherwise all users share one limit.
    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/v1/ws/ {
        # The access token is in the query string: keep it out of the access log.
        access_log off;
        proxy_pass $mxtac_backend;
        # A location with its own proxy_set_header does not inherit the ones
        # above, so they are repeated here.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass $mxtac_backend;
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }

    # Hashed build output: safe to cache for a long time.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

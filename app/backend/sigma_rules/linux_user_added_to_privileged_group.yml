title: User Added to Privileged Group
id: afd8b7d6-fd56-47ac-af62-4271206fca4e
status: test
description: Detects a user being added to a group that grants administrative rights (sudo, wheel, root, adm, docker).
author: MxTac
date: 2026-11-24
references:
  - https://attack.mitre.org/techniques/T1098/
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1098
logsource:
  product: linux
detection:
  selection_tool:
    app_name:
      - 'usermod'
      - 'gpasswd'
  selection_group:
    message|contains:
      - "to group 'sudo'"
      - "to group 'wheel'"
      - "to group 'root'"
      - "to group 'adm'"
      - "to group 'docker'"
      - 'to group sudo'
      - 'to group wheel'
      - 'to group root'
      - 'to group docker'
  condition: selection_tool and selection_group
falsepositives:
  - Approved changes to administrator group membership
  - Host provisioning scripts
level: high

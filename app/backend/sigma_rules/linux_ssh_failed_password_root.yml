title: SSH Failed Password for Root
id: b67d5827-73fd-46a2-a8fd-d15594ac491e
status: test
description: Detects a failed SSH password login for the root account. Repeated hits from one address indicate password guessing.
author: MxTac
date: 2026-11-24
references:
  - https://attack.mitre.org/techniques/T1110/001/
tags:
  - attack.credential-access
  - attack.t1110.001
logsource:
  product: linux
  service: sshd
detection:
  selection:
    message|startswith: 'Failed password for root from '
  condition: selection
falsepositives:
  - An administrator mistyping the root password
  - Automation or monitoring that still uses an old root password
level: medium

title: Shell Command History Cleared
id: fda24d2c-c732-4aa9-8e08-8a8bf90874e3
status: test
description: Detects commands that clear or disable the shell history, or that delete or overwrite the history file.
author: MxTac
date: 2026-11-24
references:
  - https://attack.mitre.org/techniques/T1070/003/
tags:
  - attack.defense-evasion
  - attack.t1070.003
logsource:
  category: process_creation
  product: linux
detection:
  selection_disable:
    CommandLine|contains:
      - 'history -c'
      - 'unset HISTFILE'
      - 'HISTFILE=/dev/null'
      - 'HISTSIZE=0'
      - 'HISTFILESIZE=0'
  selection_file:
    CommandLine|contains:
      - '.bash_history'
      - '.zsh_history'
  selection_removal:
    CommandLine|contains:
      - 'rm '
      - 'shred '
      - 'truncate '
      - 'ln -sf /dev/null'
      - 'cat /dev/null >'
  condition: selection_disable or (selection_file and selection_removal)
falsepositives:
  - Image build scripts that clean the history before a snapshot is taken
  - Users clearing their own history after typing a secret on the command line
level: medium

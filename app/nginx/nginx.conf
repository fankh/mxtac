# Reverse proxy of app/docker-compose.prod.yml.
#
#   /api/v1/ws/   backend, with the WebSocket upgrade
#   /api/         backend
#   /health       backend liveness
#   other paths   the frontend container (static build; it falls back to
#                 index.html for client-side routes such as /detections)
#
# TLS: mount the certificate and key as /etc/nginx/ssl/server.crt and
# /etc/nginx/ssl/server.key (app/nginx/ssl/ on the host).
#
# /docs, /redoc, /openapi.json, /ready and /metrics of the backend are not
# proxied.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css image/svg+xml;

    # Outer request limit per client address. The backend applies its own,
    # stricter limits per route group (login, export, write, read).
    limit_req_zone $binary_remote_addr zone=api:10m rate=600r/m;
    limit_req_status 429;

    # Docker's embedded DNS. Upstreams are resolved per request, so Nginx keeps
    # working when a backend or frontend container is re-created.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        set $mxtac_backend  http://backend:8080;
        set $mxtac_frontend http://frontend:80;

        client_max_body_size 10m;

        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        # This proxy is the edge: the client address replaces any
        # X-Forwarded-For value sent by the client. The backend uses the header
        # for its rate limits.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Live alert stream (WebSocket)
        location /api/v1/ws/ {
            # The access token is in the query string: keep it out of the access log.
            access_log off;
            proxy_pass $mxtac_backend;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # REST API
        location /api/ {
            limit_req zone=api burst=100 nodelay;
            proxy_pass $mxtac_backend;
            proxy_read_timeout 60s;
        }

        # Liveness of the backend, for external monitoring
        location = /health {
            proxy_pass $mxtac_backend;
        }

        # Web UI
        location / {
            proxy_pass $mxtac_frontend;
        }
    }
}

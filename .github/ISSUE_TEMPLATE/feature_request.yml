name: Feature request
description: Propose a change that fits the scope of the open-source core
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        MxTac is a deliberately small core. Read "Scope of the project" in CONTRIBUTING.md first:
        some features are intentionally not part of this repository.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should MxTac do? Describe the behaviour, not the implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I can open a pull request for this

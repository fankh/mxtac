title: Reverse Shell Command Line
id: ec09518a-b81b-4fe5-9bdf-dd9fc96c01e2
status: test
description: Detects command lines that open an interactive shell over a network connection with bash /dev/tcp, netcat or socat.
author: MxTac
date: 2026-11-24
references:
  - https://attack.mitre.org/techniques/T1059/004/
tags:
  - attack.execution
  - attack.t1059.004
logsource:
  category: process_creation
  product: linux
detection:
  selection_dev_tcp:
    CommandLine|contains:
      - '/dev/tcp/'
      - '/dev/udp/'
  selection_netcat:
    CommandLine|re: '\b(nc|ncat|netcat)\b.*\s-[ec]\s'
  selection_socat:
    CommandLine|contains|all:
      - 'socat'
      - 'exec:'
  condition: 1 of selection_*
falsepositives:
  - Port checks written with bash /dev/tcp in monitoring scripts
  - Authorised penetration tests
level: high
